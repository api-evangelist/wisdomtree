openapi: 3.0.3
info:
  title: WisdomTree Connect API
  version: 1.0.0
  description: |
    <h1>Overview</h1>
    <section>
        <p>
            For a general overview of WisdomTree Connect, please see the attached link:
            <a href="https://app.wisdomtreeconnect.com" target="_blank">https://app.wisdomtreeconnect.com</a>
        </p>
    </section>
    <h1 class="mb-4">Authentication</h1>
    <section>
        <h2>Introduction</h2>
        <p>
            This documentation outlines the steps to connect to the WisdomTree Connect APIs using OAuth2 authentication with password-based owner credentials. OAuth2 is an authorization framework that enables secure access to resources. Password-based owner authentication is one of the grant types provided by OAuth2.
        </p>
    </section>
    <section>
        <h2>Prerequisites</h2>
        <ul>
            <li>Access to WisdomTree Connect.</li>
            <li>User credentials – Username and Password to login to WisdomTree Connect app.</li>
        </ul>
    </section>
    <section>
        <h2>Steps to generate Client Id and Client Secret</h2>
        <ol>
            <li>
                Log in to the <strong>WisdomTree Connect app</strong> with your user credentials: <a href="https://app.wisdomtreeconnect.com" target="_blank">WisdomTree Connect</a>.
            </li>
            <li>Click on the user icon in the top-right corner.</li>
            <li>Select “API Credentials” from the dropdown menu.</li>
            <li>
                Click on <strong>Generate New</strong> button.
            </li>
            <li>
                Provide the following details:
                <ul>
                    <li>
                        <strong>Name</strong>: Any meaningful name.
                    </li>
                    <li>
                        <strong>Client Id</strong>: Autogenerated (readonly).
                    </li>
                    <li>
                        <strong>Client Secret</strong>: Autogenerated (readonly).
                    </li>
                </ul>
                <p class="mt-2">
                    <strong>Note</strong>: Please save <em>Client ID</em> and <em>Client Secret</em> somewhere safe, like in a password manager, before hitting save. You will need these values for your api authentication.
                </p>
            </li>
            <li>
                Click on <strong>Create</strong>
            </li>
            <li>Follow the next steps.</li>
        </ol>
    </section>
    <section>
        <h2>Construct Authorization Request</h2>
        <ol>
            <li>
                <p>Send a POST request to the token endpoint of the authorization server with the following parameters:</p>
                <ul>
                    <li>Grant Type: Use “password” to indicate password-based authentication.</li>
                    <li>Username</li>
                    <li>Password</li>
                    <li>Client ID</li>
                    <li>Client Secret</li>
                    <li>Scope – Use “read” to indicate read-access.</li>
                </ul>
            </li>
            <li>
                Once you receive the token from the API, you can use it in your code (Python) as shown below.
                <p>
                    <pre>
    import requests

    token_url = "https://app.wisdomtreeconnect.com/o/token/"
    api_base_url = "https://app.wisdomtreeconnect.com"

    username = "username"
    password = "password"

    client_id = "client_id"
    client_secret = "client_secret"

    data = {
        "grant_type": "password",
        "username": username,
        "password": password,
        "client_id": client_id,
        "client_secret": client_secret,
        "scope": "read",
    }

    response = requests.post(token_url, data=data)

    if response.status_code == 200:
        access_token = response.json()["access_token"]
    </pre>
                </p>
            </li>
        </ol>
    </section>
    <section>
        <h2>How to invoke API endpoints</h2>
        <ol>
            <li>
                <p>Include the access token in the Authorization header of subsequent API requests.</p>
                <p>
                    <strong>Example Python Code to Make Authorized GET Request:</strong>
                </p>
                <pre>
    headers = {
        "Authorization": "Bearer " + access_token,
        "Content-Type": "application/json",
    }

    api_url = https://app.wisdomtreeconnect.com + "/api/order/get/"
    response = requests.get(api_url, headers=headers)
                </pre>
            </li>
        </ol>
    </section>
    <section>
        <h2>Handle Token Expiry and Refresh</h2>
        <ol>
            <li>
                <p>
                    OAuth2 access tokens have a limited lifespan. Ensure that your application handles token expiry gracefully by implementing token refresh mechanisms. When a token expires, use the refresh token to obtain a new access without requiring authentication.
                </p>
            </li>
        </ol>
    </section>
    </div>
paths:
  /api/accruals/:
    get:
      operationId: Retrieves Open Accruals
      description: Retrieves a list of all open accruals for organization.
      parameters:
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: 'Optional. For Moderator users only: target client organization GUID.'
      tags:
        - Accruals
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetOpenAccruals'
          description: ''
  /api/dividend-payment-preferences/:
    get:
      operationId: Retrieves All Dividend Payment Preferences
      description: Retrieves the dividend payment preferences table content for the organization.
      parameters:
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: 'Optional. For Moderator users only: target client organization GUID.'
      tags:
        - Dividend Payment Preferences
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DividendPaymentPreferenceListItem'
          description: ''
  /api/dividend-payment-preferences/{dpp_guid}:
    get:
      operationId: Retrieve Dividend Payment Preference Details
      description: Retrieves a specific dividend payment preference record together with editable field metadata such as dividend payment currency choices.
      parameters:
        - in: path
          name: dpp_guid
          schema:
            type: string
          required: true
      tags:
        - Dividend Payment Preferences
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DividendPaymentPreferenceDetail'
          description: ''
  /api/dividend-payment-preferences/{dpp_guid}/edit:
    post:
      operationId: Update Dividend Payment Preferences
      description: Updates the dividend payment preference for a specific organization mapping.
      parameters:
        - in: path
          name: dpp_guid
          schema:
            type: string
          required: true
      tags:
        - Dividend Payment Preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditDividendPaymentPreferences'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditDividendPaymentPreferences'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditDividendPaymentPreferences'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditDividendPaymentPreferences'
          description: ''
  /api/dividend-payment-preferences/export:
    get:
      operationId: Download Dividend Payment Preferences Workbook
      description: Downloads the dividend payment preferences table as an Excel workbook.
      parameters:
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: 'Optional. For Moderator users only: target client organization GUID.'
      tags:
        - Dividend Payment Preferences
      security:
        - oauth2:
            - read
      responses:
        '200':
          description: Dividend payment preferences workbook (.xlsx)
  /api/orders/:
    post:
      operationId: Create Order
      description: Creates a new order. Schema depends on issuer_name.
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
          description: Optional key to make order creation idempotent. Reusing the same key with the same payload replays the original success response.
      tags:
        - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
            examples:
              WTGXX-USD:
                value:
                  exchange_code: WTGXX
                  quantity: 10000.345
                  trade_type: Sale
                  settlement_currency: USD
                  blockchain: Ethereum Sepolia
                  settlement_wallet: '0x0000000000000000000000000000000000000000'
              WTGXX-USDC:
                value:
                  exchange_code: WTGXX
                  quantity: 10000.345
                  trade_type: Sale
                  settlement_currency: USDC
                  blockchain: Ethereum Sepolia
                  settlement_wallet: '0x0000000000000000000000000000000000000000'
                  wisdomtree_deposit_wallet: '0x1000000000000000000000000000000000000000'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                Response:
                  value:
                    message: 'Order #order number created successfully'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateError'
              examples:
                Response:
                  value:
                    error: string
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Response:
                  value:
                    error: string
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/{order_reference}:
    get:
      operationId: Retrieves Order Details
      description: Retrieves details of a specific order.
      parameters:
        - in: path
          name: order_reference
          schema:
            type: string
          required: true
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WTCOrderDetailsResponse'
              examples:
                WTGXX-USD:
                  value:
                    order_reference: 5a305244015843c6283a
                    order_date: '1900-01-01'
                    exchange_code: WTGXX
                    quantity: 10000.345
                    expected_settlement_date: '1900-01-01'
                    trade_type: Sale
                    settlement_currency: USD
                    blockchain: Ethereum Sepolia
                    token_contract_address: '0x0000000000000000000000000000000000000000'
                    settlement_wallet_address: '0x0000000000000000000000000000000000000000'
                    gross_value: '10000.00000000'
                    net_value: '10000.00000000'
                    transaction_fee: '0.00000000'
                    network_fee: '0.00000000'
                    rate: '1.00000000'
                    user: user
                    org: org
                    status: status
                WTGXX-USDC:
                  value:
                    order_reference: 5a305244015843c61111
                    order_date: '1900-01-01'
                    exchange_code: WTGXX
                    quantity: 10000.345
                    expected_settlement_date: '1900-01-01'
                    trade_type: Sale
                    settlement_currency: USDC
                    blockchain: Ethereum Sepolia
                    token_contract_address: '0x0000000000000000000000000000000000000000'
                    settlement_wallet_address: '0x0000000000000000000000000000000000000000'
                    wisdomtree_deposit_wallet_address: '0x1000000000000000000000000000000000000000'
                    gross_value: '10000.00000000'
                    net_value: '10000.00000000'
                    transaction_fee: '0.00000000'
                    network_fee: '0.00000000'
                    rate: '1.00000000'
                    user: user
                    org: org
                    status: status
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/{order_reference}/fetch-hash:
    post:
      operationId: Fetch Missing Order Hashes
      description: Fetches missing conversion, deposit, and issuer transaction hashes for a settled, accessible order and returns the stored hashes. USD orders use only the issuer hash. Values can remain null until a hash is available. No request body is required.
      parameters:
        - in: path
          name: order_reference
          schema:
            type: string
          required: true
      tags:
        - Orders
      security:
        - oauth2:
            - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHashesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/{order_reference}/notes:
    post:
      operationId: Create Order Note
      description: Creates a comment note for a specific order.
      parameters:
        - in: path
          name: order_reference
          schema:
            type: string
          required: true
      tags:
        - Orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrderNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrderNote'
        required: true
      security:
        - oauth2:
            - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNoteResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/{order_reference}/status:
    get:
      operationId: Retrieves Order Status
      description: Retrieves status and next available statuses of a specific order.
      parameters:
        - in: path
          name: order_reference
          schema:
            type: string
          required: true
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatus'
          description: ''
  /api/orders/all:
    get:
      operationId: Retrieves All Orders for Org
      description: Retrieves all accessible orders across issuers. Unlike `/api/orders/`, this endpoint does not default to today's date when no dates are passed.
      parameters:
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD).
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD).
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/deposit_address:
    get:
      operationId: Retrieves WisdomTree Deposit Address
      description: Retrieves the WisdomTree deposit address (exchange wallet address) for the authenticated user's organisation, exchange_code, and blockchain.
      parameters:
        - in: query
          name: blockchain
          schema:
            type: string
          description: Blockchain name, for example `Base Testnet Sepolia`.
          required: true
        - in: query
          name: exchange_code
          schema:
            type: string
          description: Fund exchange code, for example `WTGXX`.
          required: true
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: Optional for moderator users. When provided, resolves the deposit address for a mapped client organization; otherwise the moderator's own organization is used.
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositAddressResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/details/batch:
    get:
      operationId: Retrieve Multiple Order Details
      description: Retrieves accessible order details in the order of the supplied references. Returns 404 when any reference is missing or inaccessible.
      parameters:
        - in: query
          name: order_references
          schema:
            type: array
            items:
              type: string
          description: Comma-separated order references, up to 100 references.
          required: true
          explode: false
          style: form
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WTCOrderDetailsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/export:
    get:
      operationId: Download Orders Workbook
      description: Downloads the filtered orders list as an Excel workbook.
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          description: Orders workbook (.xlsx)
        '400':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/hash/{hash}:
    get:
      operationId: Retrieve Order Details by Hash
      description: Retrieves an accessible order matching conversion_order_hash, deposit_hash, or issuer_order_hash. Returns the same details as the order details endpoint.
      parameters:
        - in: path
          name: hash
          schema:
            type: string
          required: true
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WTCOrderDetailsResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/latest:
    get:
      operationId: Retrieves Latest Accessible Orders
      description: Retrieves the latest 25 accessible orders across issuers. This endpoint does not default to today's date and includes moderator-visible client orders.
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestOrdersResponse'
          description: ''
  /api/orders/on-receipt-wallet/:
    get:
      operationId: Retrieves wallet address for on receipt order
      description: Retrieves on receipt wallet address for trade type, blockchain, fund, and currency.
      parameters:
        - in: query
          name: blockchain
          schema:
            type: string
          description: Blockchain name.
          required: true
        - in: query
          name: currency
          schema:
            type: string
          description: Stablecoin currency symbol.
          required: true
        - in: query
          name: fund
          schema:
            type: string
          description: Fund ticker (order token asset ticker).
          required: true
        - in: query
          name: trade_type
          schema:
            type: string
          description: 'Trade type: Purchase or Sale.'
          required: true
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnReceiptWallet'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/order-mapping:
    get:
      operationId: Retrieve Order Mapping
      description: Returns the cached trade mapping data used to render the WT Connect On Receipt and Instant Liquidity pages. Use market_type=primary for On Receipt and market_type=secondary for Instant Liquidity.
      parameters:
        - in: query
          name: market_type
          schema:
            type: string
          description: Use 'primary' for On Receipt or 'secondary' for Instant Liquidity.
          required: true
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickMarketMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/portfolio:
    get:
      operationId: Retrieve Connect Portfolio Page
      description: Returns holdings for the current organization or a mapped moderator client. A moderator's own portfolio is empty.
      parameters:
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: Mapped client GUID for moderators.
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/portfolio/download:
    get:
      operationId: Download Connect Portfolio Workbook
      description: Downloads the same portfolio workbook used by the Connect portfolio page. A moderator's own workbook has no holdings.
      parameters:
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: Mapped client GUID for moderators.
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          description: Portfolio workbook (.xlsx)
        '400':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/orders/products:
    get:
      operationId: Retrieve User Initiated Order Products
      description: Returns order products for the user. For moderators selecting a mapped client, returns the client's active subscribed products for issuers the moderator can read and input; permitted products can always be traded regardless of trading hours. If exchange_code is provided, the response also includes the current backend-driven form fields for that product using the query params passed in.
      parameters:
        - in: query
          name: blockchain
          schema:
            type: string
          description: Optional current blockchain for dynamic form resolution.
        - in: query
          name: exchange_code
          schema:
            type: string
          description: Selected product exchange code.
        - in: query
          name: organization_guid
          schema:
            type: string
            format: uuid
          description: Optional mapped moderator client GUID used to scope products, wallets, and related form data.
        - in: query
          name: settlement_currency
          schema:
            type: string
          description: Optional current settlement currency for dynamic form resolution.
        - in: query
          name: trade_type
          schema:
            type: string
          description: Optional current trade type for dynamic form resolution.
      tags:
        - Orders
      security:
        - oauth2:
            - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProductSelectionResponse'
