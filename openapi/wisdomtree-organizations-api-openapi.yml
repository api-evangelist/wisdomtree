paths:
  /api/organizations/me:
    get:
      operationId: RetrievesCurrentUser'sOrganizationDetails
      description: Retrieves the details of the organization belonging to the current user. For moderators, will also return client organization details.
      tags:
      - Organizations
      security:
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
              examples:
                Response:
                  value:
                    emails: []
                    guid: a3c9d5b7-8a4d-4e35-9c1e-417cba654e2c
                    legal_name: Direct Customer
                    name: Direct Customer
                    wallets:
                      data:
                        Ethereum Sepolia:
                        - wallet_guid: a3c9d5b7-8a4d-4e35-9c1e-417cba654e2d
                          public_key: '0x0000000000000000000000000000000000000000'
                          status: Approved
                    address:
                      line_1: ''
                      line_2: ''
                      line_3: ''
                      town: ''
                      area: ''
                      post_code: ''
                      country: ''
                      telephone_number: ''
                      mobile_number: ''
                    client_organizations:
                    - guid: b4d0e6c8-9b5e-5f46-0d2f-528dcb765f3e
                      name: Client1
                      legal_name: Client Org 1
                      client_external_id: client-001
          description: ''
      summary: Retrieves current user's organization details
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: Retrieves current user's organization details
