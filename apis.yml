    name: OpenAPI (provider-hosted)
    url: https://docs.wisdomtreeconnect.com/openapi/connect.openapi.yaml
  - type: Documentation
    url: https://docs.wisdomtreeconnect.com/
  - type: GettingStarted
    url: https://docs.wisdomtreeconnect.com/guides/direct-org.md
  - type: JSONSchema
