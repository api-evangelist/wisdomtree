apis:
- aid: wisdomtree:wisdomtree-connect-api
  name: WisdomTree Connect API
  description: REST API for WisdomTree Connect, the tokenized-fund platform. Organizations, wallets, assets and orders (subscriptions as trade_type
    Purchase, redemptions as Sale), authenticated with an OAuth2 password grant at POST /o/token/. Separate sandbox environment with its own credentials.
  humanURL: https://docs.wisdomtreeconnect.com/
  baseURL: https://app.wisdomtreeconnect.com
  tags:
  - Tokenized Funds
  - Orders
  - Wallets
  properties:
