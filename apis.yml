aid: wisdomtree

name: WisdomTree

description: WisdomTree is a global asset manager issuing ETFs and tokenized funds. Through WisdomTree Connect it offers an OAuth2-secured REST
  API for institutions to create subscription and redemption orders, manage wallets and track settlement of regulated tokenized assets, plus a
  DataSpan Fund Data API for NAV, aggregates, accruals and shares outstanding per fund ticker.

