- aid: wisdomtree:wisdomtree-dataspan-fund-data-api
  name: WisdomTree DataSpan Fund Data API
  description: Read-only fund data API returning NAV, daily aggregates and historical metrics, open accruals, shares outstanding and aggregates
    per supported WisdomTree fund ticker. Requires the x-wt-dataspan-key header. No published contract; the local OpenAPI is generated from the
    provider's structured documentation and marked as such.
  humanURL: https://docs.wisdomtreeconnect.com/
  baseURL: https://dataspanapi.wisdomtree.com
  tags:
  - Fund Data
  - NAV
  properties:
  - type: OpenAPI
    url: openapi/_ae-authored/wisdomtree-dataspan-openapi-generated.yml
  - type: Documentation
    url: https://docs.wisdomtreeconnect.com/

